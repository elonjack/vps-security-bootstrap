name: Lint

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  shell:
    name: Bash syntax and ShellCheck
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck

      - name: Verify script
        run: |
          test "$(head -n 1 bootstrap.sh)" = '#!/usr/bin/env bash'
          test "$(head -n 1 install.sh)" = '#!/usr/bin/env bash'
          ! grep -n $'\r' bootstrap.sh install.sh
          bash -n bootstrap.sh install.sh
          shellcheck --severity=warning bootstrap.sh install.sh
          version=$(sed -n "s/^readonly SCRIPT_VERSION='\\([^']*\\)'$/\\1/p" bootstrap.sh)
          installer_version=$(sed -n "s/^readonly INSTALLER_VERSION='\\([^']*\\)'$/\\1/p" install.sh)
          test -n "$version"
          test "$version" = "$installer_version"
          grep -F "version=$version" README.md
          grep -F "sha256sum --check install.sh.sha256" README.md
          grep -F 'sha256sum --check --status bootstrap.sh.sha256' install.sh
          grep -F 'bash "$SCRIPT_PATH" "${BOOTSTRAP_ARGS[@]}" </dev/tty' install.sh
          grep -F '[ -r /dev/tty ]' install.sh
          grep -F "readonly FIREWALL_TABLE='vps_security_bootstrap'" bootstrap.sh
          grep -F 'type filter hook input priority filter; policy drop;' bootstrap.sh
          grep -F 'flags interval' bootstrap.sh
          grep -F 'nft delete table inet "$FIREWALL_TABLE"' bootstrap.sh
          grep -F '停用本脚本管理的防火墙' bootstrap.sh
          grep -F '重新加载本脚本管理的防火墙' bootstrap.sh
          grep -F '追加额外 TCP 放行端口' bootstrap.sh
          grep -F 'append_firewall_ports' bootstrap.sh
          grep -F '追加额外 TCP 放行端口' README.md
          grep -F 'prompt_block >&2 <<EOF' bootstrap.sh
          ! grep -F 'systemctl stop nftables' bootstrap.sh
          ! grep -F 'systemctl restart nftables' bootstrap.sh
          grep -F '20000-20199' README.md
          git diff --check

  powershell:
    name: Windows PowerShell 5.1 syntax and smoke tests
    runs-on: windows-2022
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Verify Windows scripts
        shell: powershell
        run: |
          Install-Module `
            -Name PSScriptAnalyzer `
            -RequiredVersion 1.25.0 `
            -Scope CurrentUser `
            -Repository PSGallery `
            -Force
          Import-Module PSScriptAnalyzer -RequiredVersion 1.25.0

          $path = Join-Path $PWD 'windows-bootstrap.ps1'
          $installerPath = Join-Path $PWD 'install.ps1'
          $bytes = [IO.File]::ReadAllBytes($path)
          if ($bytes.Length -lt 3 -or $bytes[0] -ne 0xef -or $bytes[1] -ne 0xbb -or $bytes[2] -ne 0xbf) {
            throw 'windows-bootstrap.ps1 must use UTF-8 with BOM for Windows PowerShell 5.1.'
          }
          if ([IO.File]::ReadAllText($path).Contains("`r")) {
            throw 'windows-bootstrap.ps1 must use LF line endings.'
          }
          $installerBytes = [IO.File]::ReadAllBytes($installerPath)
          if ($installerBytes.Length -lt 3 -or $installerBytes[0] -ne 0xef -or $installerBytes[1] -ne 0xbb -or $installerBytes[2] -ne 0xbf) {
            throw 'install.ps1 must use UTF-8 with BOM for Windows PowerShell 5.1.'
          }
          if ([IO.File]::ReadAllText($installerPath).Contains("`r")) {
            throw 'install.ps1 must use LF line endings.'
          }

          $tokens = $null
          $errors = $null
          [Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count) { throw ($errors | ForEach-Object Message | Out-String) }
          $installerTokens = $null
          $installerErrors = $null
          [Management.Automation.Language.Parser]::ParseFile(
            $installerPath,
            [ref]$installerTokens,
            [ref]$installerErrors
          ) | Out-Null
          if ($installerErrors.Count) { throw ($installerErrors | ForEach-Object Message | Out-String) }

          $installerDefinition = Get-Content -LiteralPath $installerPath -Raw -Encoding UTF8
          if ($installerDefinition -match '(?m)^\s*param\s*\(') {
            throw 'install.ps1 must not use a script-level param block: its quick command executes it with Invoke-Expression.'
          }
          if ($installerDefinition -match '(?m)^\s*\[CmdletBinding\(\)\]') {
            throw 'install.ps1 must not use script-level CmdletBinding: Invoke-Expression cannot run it safely.'
          }

          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force
          . $path
          foreach ($source in @(
            (Get-RdpGuardSource),
            (Get-RestoreSource),
            (Get-RdpPortCleanupSource),
            (Get-TelegramNotifierSource),
            (Get-TelegramLoginWatcherSource)
          )) {
            $embeddedTokens = $null
            $embeddedErrors = $null
            [Management.Automation.Language.Parser]::ParseInput(
              $source,
              [ref]$embeddedTokens,
              [ref]$embeddedErrors
            ) | Out-Null
            if ($embeddedErrors.Count) { throw ($embeddedErrors | ForEach-Object Message | Out-String) }
            $embeddedAnalysis = @(Invoke-ScriptAnalyzer -ScriptDefinition $source -Severity Warning, Error)
            if ($embeddedAnalysis.Count) {
              throw ($embeddedAnalysis | Format-Table -AutoSize | Out-String)
            }
          }

          $analysis = @(Invoke-ScriptAnalyzer -Path $path -Severity Warning, Error)
          if ($analysis.Count) { throw ($analysis | Format-Table -AutoSize | Out-String) }
          $installerAnalysis = @(Invoke-ScriptAnalyzer -Path $installerPath -Severity Warning, Error)
          if ($installerAnalysis.Count) { throw ($installerAnalysis | Format-Table -AutoSize | Out-String) }

          if (-not (Test-IpOrCidr '203.0.113.10')) { throw 'IPv4 validation failed.' }
          if (-not (Test-IpOrCidr '2001:db8::/64')) { throw 'IPv6 CIDR validation failed.' }
          if (Test-IpOrCidr '203.0.113.10/99') { throw 'Invalid CIDR was accepted.' }
          if (Test-IpOrCidr '1.2.3') { throw 'Non-canonical IPv4 was accepted.' }
          if (-not (Test-AddressInNetwork '203.0.113.10' '203.0.113.0/24')) {
            throw 'IPv4 CIDR membership test failed.'
          }
          Assert-TelegramSetting `
            -Token '123456789:ABCDEFGHIJKLMNOPQRSTUVWXYZ_abcd' `
            -ChatId '-1001234567890' `
            -VpsName 'CI-Windows'
          $invalidTelegramCaught = $false
          try {
            Assert-TelegramSetting -Token 'bad' -ChatId 'x' -VpsName "bad`nname"
          } catch {
            $invalidTelegramCaught = $true
          }
          if (-not $invalidTelegramCaught) { throw 'Invalid Telegram settings were accepted.' }
          if ((Get-RdpGuardSource) -notmatch 'protectedPorts') {
            throw 'RDP Guard must protect both the current and target ports before reboot.'
          }
          if ((Get-RdpPortCleanupSource) -notmatch 'VpsSecurity-RdpAllow-Current-\*') {
            throw 'The one-time old-port cleanup rule is missing.'
          }
          if ((Get-Command Set-WindowsAutomaticUpdate -ErrorAction SilentlyContinue) -eq $null) {
            throw 'Windows Update control function is missing.'
          }
          Set-WindowsAutomaticUpdate -Disable $true -WhatIf
          if ((Get-Content -LiteralPath $path -Raw -Encoding UTF8) -notmatch 'NoAutoUpdate') {
            throw 'Windows Update control must set the NoAutoUpdate policy.'
          }
          if ((Get-Content -LiteralPath $path -Raw -Encoding UTF8) -notmatch 'WindowsUpdate') {
            throw 'Windows Update menu action is missing.'
          }

          $versionMatch = Select-String -Path $path -Pattern "ScriptVersion = '(v[^']+)'"
          if (-not $versionMatch) { throw 'Windows script version is missing.' }
          $version = $versionMatch.Matches[0].Groups[1].Value
          if (-not (Select-String -Path README.md -SimpleMatch "`$version = '$version'")) {
            throw 'README Windows version does not match the script.'
          }
          $installerVersionMatch = Select-String `
            -Path $installerPath `
            -Pattern "Version = '(v[^']+)'"
          if (-not $installerVersionMatch) { throw 'Windows installer version is missing.' }
          $installerVersion = $installerVersionMatch.Matches[0].Groups[1].Value
          if ($installerVersion -ne $version) {
            throw 'Windows installer version does not match the main script.'
          }
          if (-not (Select-String -Path $installerPath -SimpleMatch 'Get-FileHash')) {
            throw 'Windows installer must verify SHA-256 before execution.'
          }
